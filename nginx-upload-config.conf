# Nginx configuration snippet for increasing upload size limits
# Add this to your nginx site configuration file (usually in /etc/nginx/sites-available/your-site)

# Increase client body size limit to 50MB (for file uploads)
client_max_body_size 50M;

# Increase buffer sizes for large uploads
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 16k;

# Increase timeouts for large file uploads
client_body_timeout 300s;
client_header_timeout 300s;
send_timeout 300s;

